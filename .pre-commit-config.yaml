repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^CHANGELOG\.md$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-machete
        name: cargo machete
        entry: cargo machete
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        pass_filenames: false

      - id: typos
        name: typos
        entry: typos
        language: system
        pass_filenames: false

      - id: cargo-check
        name: cargo check & clippy & test (both modes)
        entry: bash -c 'cargo clippy -- -D warnings && cargo nextest run --lib && cargo clippy --no-default-features --features "blocking,ureq-client" -- -D warnings && cargo nextest run --no-default-features --features "blocking,ureq-client" --lib'
        language: system
        types: [rust]
        pass_filenames: false
