name: Release

on:
  push:
    branches: [master]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: a-line-services/release-pilot@v1
        with:
          cargo-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
