name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.85"
  BLOCKING_FEATURES: --no-default-features --features "blocking,ureq-client"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.mode }}, ${{ matrix.rust }})
    needs: fmt
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]
        mode: [async, blocking]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.mode }}-${{ matrix.rust }}
      - name: Run clippy
        run: cargo clippy ${{ matrix.mode == 'blocking' && env.BLOCKING_FEATURES || '' }} --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.mode }}, ${{ matrix.rust }})
    needs: fmt
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]
        mode: [async, blocking]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.mode }}-${{ matrix.rust }}
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run ${{ matrix.mode == 'blocking' && env.BLOCKING_FEATURES || '' }} --lib

  msrv:
    name: MSRV (${{ matrix.mode }})
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [async, blocking]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.mode }}
      - name: Check MSRV
        run: cargo check ${{ matrix.mode == 'blocking' && env.BLOCKING_FEATURES || '' }}

  docs:
    name: Docs (${{ matrix.mode }})
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [async, blocking]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs-${{ matrix.mode }}
      - name: Build docs
        run: cargo doc --no-deps ${{ matrix.mode == 'blocking' && env.BLOCKING_FEATURES || '' }}
        env:
          RUSTDOCFLAGS: -D warnings

  machete:
    name: Unused Deps
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  # TODO: Re-enable after v0.1.0 is published to crates.io
