[package]
name = "topstats"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "Rust SDK for the TopStats.gg API - Discord bot statistics tracking"
repository = "https://github.com/top-stats/rust-sdk"
documentation = "https://docs.rs/topstats"
readme = "README.md"
keywords = ["discord", "bot", "statistics", "topgg", "api"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["reqwest-client", "rustls-tls"]

# HTTP client backends
reqwest-client = ["dep:reqwest"]
ureq-client = ["dep:ureq", "blocking"]

# Blocking API support
blocking = []

# TLS backends (for reqwest)
rustls-tls = ["reqwest?/rustls-tls"]
native-tls = ["reqwest?/native-tls"]

# Optional features
tracing = ["dep:tracing"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Async
async-trait = "0.1"
futures = "0.3"

# HTTP clients (feature-gated)
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
ureq = { version = "2.9", features = ["json"], optional = true }
urlencoding = "2.1"

# Logging (optional)
tracing = { version = "0.1", optional = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
wiremock = "0.6"
pretty_assertions = "1.4"
tokio-test = "0.4"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
